[project]
name = "cadoopet-bot"
version = "0.1.0"
description = "Telegram bot that automates invoice processing using Google Gemini AI, Google Sheets, and Google Drive"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==21.10",
    "google-generativeai==0.8.4",
    "gspread==6.1.4",
    "google-auth==2.37.0",
    "google-api-python-client==2.159.0",
    "python-dotenv==1.0.1",
    "Pillow>=11.1.0",
]
